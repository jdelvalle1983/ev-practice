name: Test EV finder

on: push

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - run: pip install -r requirements.txt
      - run: echo 55000 | python ev_finder.py    
          